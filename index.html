<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Athena | Intelligent Concept Simplifier</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { darkMode: "class" };
    </script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Inter:wght@300;400;500;600&display=swap");

      :root {
        --athena-blue: #a0c4ff;
        --athena-bg: #f0f7ff;
        --athena-surface: #ffffff;
        --athena-text: #2d3436;
        --transition-speed: 0.5s;
      }

      /* Modern Pastel Mode Themes */
      .theme-child {
        --athena-blue: #ffadad;
        --athena-bg: #fff5f5;
      }
      .theme-beginner {
        --athena-blue: #a0c4ff;
        --athena-bg: #f0f7ff;
      }
      .theme-adult {
        --athena-blue: #bdb2ff;
        --athena-bg: #f8f7ff;
      }

      /* Sophisticated Dark Mode Palette */
      .dark-mode {
        --athena-bg: #0d1117;
        --athena-surface: #161b22;
        --athena-text: #e6edf3;
        --athena-blue: #58a6ff;
      }

      /* Global Dark Mode Overrides */
      .dark-mode body {
        background-color: var(--athena-bg);
        color: var(--athena-text);
      }
      .dark-mode .bg-white,
      .dark-mode .bg-white\/80,
      .dark-mode .bg-slate-900 {
        background-color: var(--athena-surface) !important;
        border-color: #30363d !important;
      }

      .dark-mode header {
        background-color: rgba(22, 27, 34, 0.8) !important;
        border-color: #30363d !important;
      }

      .dark-mode .bg-gray-50,
      .dark-mode .bg-indigo-50,
      .dark-mode .bg-slate-700,
      .dark-mode .bg-slate-800 {
        background-color: #0d1117 !important;
        border: 1px solid #30363d;
        color: var(--athena-text) !important;
      }

      .dark-mode .shadow-xl,
      .dark-mode .shadow-2xl,
      .dark-mode .shadow-indigo-100\/50,
      .dark-mode .shadow-sm {
        box-shadow: none !important;
      }

      .dark-mode .text-gray-700,
      .dark-mode .text-gray-900,
      .dark-mode .text-inherit {
        color: var(--athena-text) !important;
      }

      .dark-mode .text-gray-400 {
        color: #8b949e !important;
      }

      body {
        font-family: "Inter", sans-serif;
        background-color: var(--athena-bg);
        color: var(--athena-text);
        min-height: 100vh;
        transition:
          background-color var(--transition-speed),
          color var(--transition-speed);
        margin: 0;
        display: flex;
        overflow-x: hidden;
      }

      .google-sans {
        font-family: "Google Sans", sans-serif;
      }

      /* Sidebar Styles */
      #sidebar {
        position: fixed;
        left: -280px;
        top: 0;
        bottom: 0;
        width: 280px;
        background: var(--athena-surface);
        border-right: 1px solid rgba(0, 0, 0, 0.05);
        z-index: 100;
        transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        display: flex;
        flex-direction: column;
        padding: 1.5rem;
      }

      #sidebar.open {
        left: 0;
        box-shadow: 20px 0 50px rgba(0, 0, 0, 0.1);
      }

      .sidebar-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.3);
        backdrop-filter: blur(2px);
        z-index: 90;
        opacity: 0;
        visibility: hidden;
        transition: all 0.3s;
      }

      .sidebar-overlay.visible {
        opacity: 1;
        visibility: visible;
      }

      /* Sidebar Button Contrast Fix */
      .dark-mode #sidebar .history-item:hover,
      .dark-mode #sidebar button:hover {
        background-color: #21262d !important;
        color: #ffffff !important;
      }

      .history-item {
        padding: 0.75rem 1rem;
        border-radius: 12px;
        font-size: 0.875rem;
        cursor: pointer;
        transition: all 0.2s;
        margin-bottom: 0.25rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        color: #64748b;
      }

      .dark-mode .history-item {
        color: #8b949e;
      }

      /* Segmented Control - Fixed Contrast */
      .segmented-control {
        background: rgba(0, 0, 0, 0.08);
        padding: 4px;
        border-radius: 20px;
        display: flex;
        position: relative;
        backdrop-filter: blur(10px);
      }

      .dark-mode .segmented-control {
        background: rgba(255, 255, 255, 0.08);
      }

      .segment-btn {
        flex: 1;
        padding: 10px 20px;
        font-size: 0.875rem;
        font-weight: 600;
        border-radius: 16px;
        z-index: 1;
        transition: color 0.3s;
        color: #64748b;
      }

      .dark-mode .segment-btn {
        color: #8b949e;
      }

      /* Enforce Black text for Child/Beginner/Expert when active */
      .segment-btn.active,
      .dark-mode .segment-btn.active {
        color: #000000 !important;
      }

      .slider {
        position: absolute;
        height: calc(100% - 8px);
        width: calc(33.33% - 4px);
        background: var(--athena-blue);
        border-radius: 16px;
        transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      }

      /* Splash Screen */
      #splash-screen {
        position: fixed;
        inset: 0;
        background: white;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        transition:
          opacity 0.8s ease-out,
          visibility 0.8s;
      }

      /* Splash wordmark */
      .splash-wordmark {
        animation: splashPop 0.7s cubic-bezier(0.23, 1, 0.32, 1) forwards;
      }
      @keyframes splashPop {
        from {
          opacity: 0;
          transform: translateY(12px) scale(0.96);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      .chat-bubble {
        max-width: 85%;
        animation: slideUp 0.5s cubic-bezier(0.23, 1, 0.32, 1);
      }

      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .hero-subtitle {
        font-size: clamp(1.5rem, 5vw, 2.25rem);
        font-weight: 500;
        color: var(--athena-text);
        letter-spacing: -0.03em;
        line-height: 1.2;
      }

      /* Modal Styles */
      .modal {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(8px);
        z-index: 200;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        visibility: hidden;
        transition: all 0.3s;
      }

      .modal.open {
        opacity: 1;
        visibility: visible;
      }

      .modal-content {
        background: white;
        padding: 2.5rem;
        border-radius: 32px;
        max-width: 500px;
        width: 90%;
        transform: scale(0.9);
        transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }

      .modal.open .modal-content {
        transform: scale(1);
      }

      .dark-mode #sidebar,
      .dark-mode .modal-content,
      .dark-mode header {
        background-color: var(--athena-surface) !important;
        border-color: #30363d !important;
        color: var(--athena-text) !important;
      }

      .jargon {
        border-bottom: 2px dashed var(--athena-blue);
        cursor: help;
        position: relative;
        outline: none;
      }
      .jargon:hover::after,
      .jargon:focus-visible::after {
        content: attr(data-tooltip);
        position: absolute;
        bottom: 130%;
        left: 50%;
        transform: translateX(-50%);
        background: #21262d;
        color: white;
        padding: 10px 14px;
        border-radius: 12px;
        font-size: 0.8rem;
        width: min(280px, 85vw);
        max-width: 90vw;
        z-index: 60;
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
        line-height: 1.4;
        pointer-events: none;
        word-wrap: break-word;
      }
      .jargon:focus-visible {
        box-shadow: 0 0 0 2px var(--athena-blue);
        border-radius: 4px;
      }

      /* AI answer body — force theme text (beats stray Tailwind text-* on children) */
      .answer-panel .output-content,
      .answer-panel .output-content p,
      .answer-panel .output-content li,
      .answer-panel .output-content ul {
        color: var(--athena-text) !important;
      }
      .answer-panel .output-content .jargon {
        color: var(--athena-text) !important;
        border-bottom-color: var(--athena-blue);
      }
      .answer-panel .output-content .text-red-500 {
        color: rgb(239 68 68) !important;
      }
      .dark-mode .answer-panel .output-content .text-red-400 {
        color: rgb(248 113 113) !important;
      }

      /* No Tailwind dark:bg-* here — OS "prefers dark" was styling the card while --athena-text stayed light-theme */
      .answer-panel {
        background: var(--athena-surface);
        color: var(--athena-text);
        border: 1px solid rgba(0, 0, 0, 0.08);
      }
      .dark-mode .answer-panel {
        border-color: #30363d;
      }

      .athena-popover {
        background: var(--athena-surface);
        color: var(--athena-text);
        border: 1px solid rgba(0, 0, 0, 0.08);
      }
      .dark-mode .athena-popover {
        border-color: #30363d;
      }

      #attachmentPreview:not(.hidden) {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        flex-wrap: wrap;
      }
      .athena-popover button {
        color: var(--athena-text);
      }

      .athena-video-footer {
        background: var(--athena-surface);
        color: var(--athena-text);
        border-color: rgba(0, 0, 0, 0.06) !important;
      }
      .dark-mode .athena-video-footer {
        border-color: #30363d !important;
      }

      .capsule {
        background: var(--athena-surface);
        border: 1px solid rgba(0, 0, 0, 0.1);
        padding: 8px 18px;
        border-radius: 24px;
        font-size: 0.85rem;
        font-weight: 500;
        transition: all 0.3s;
        cursor: pointer;
      }
      .capsule:hover {
        border-color: var(--athena-blue);
        color: var(--athena-blue);
        transform: translateY(-2px);
      }

      /* Attachment Menu Styling & FIXED DARK MODE HOVER */
      #attachmentMenu {
        animation: fadeInScale 0.2s ease-out;
      }

      .dark-mode #attachmentMenu button:hover {
        background-color: #30363d !important;
        color: #ffffff !important;
      }

      @keyframes fadeInScale {
        from {
          opacity: 0;
          transform: scale(0.95) translateY(10px);
        }
        to {
          opacity: 1;
          transform: scale(1) translateY(0);
        }
      }

      .hidden-el {
        display: none !important;
      }

      /* Firebase auth overlay — glassmorphism */
      #authOverlay {
        position: fixed;
        inset: 0;
        z-index: 10050;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background: linear-gradient(
          145deg,
          rgba(240, 247, 255, 0.55),
          rgba(160, 196, 255, 0.35)
        );
        backdrop-filter: blur(20px) saturate(1.2);
        -webkit-backdrop-filter: blur(20px) saturate(1.2);
      }
      #authOverlay.auth-hidden {
        display: none !important;
      }
      .auth-glass-card {
        width: min(420px, 100%);
        padding: 2.5rem 2rem;
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.55);
        box-shadow:
          0 25px 50px -12px rgba(0, 0, 0, 0.18),
          inset 0 1px 0 rgba(255, 255, 255, 0.85);
      }
      .dark-mode .auth-glass-card {
        background: rgba(22, 27, 34, 0.82);
        border-color: rgba(48, 54, 61, 0.9);
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.45);
      }
      #signInGoogleBtn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.6rem;
        width: 100%;
        margin-top: 1.5rem;
        padding: 0.9rem 1.25rem;
        border-radius: 9999px;
        font-weight: 700;
        font-size: 0.95rem;
        color: #1e293b;
        background: #fff;
        border: 1px solid rgba(0, 0, 0, 0.08);
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
        cursor: pointer;
        transition:
          transform 0.15s ease,
          box-shadow 0.2s ease;
      }
      #signInGoogleBtn:hover {
        transform: translateY(-1px);
        box-shadow: 0 8px 22px rgba(0, 0, 0, 0.12);
      }
      #userProfile {
        display: none;
        align-items: center;
        gap: 0.65rem;
        max-width: min(280px, 42vw);
      }
      #userProfile.visible {
        display: flex;
      }
      #userProfileName {
        font-size: 0.8rem;
        font-weight: 600;
        color: #475569;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .dark-mode #userProfileName {
        color: #cbd5e1;
      }
      #userProfileSignOut {
        font-size: 0.7rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        padding: 0.4rem 0.75rem;
        border-radius: 9999px;
        border: 1px solid rgba(99, 102, 241, 0.35);
        color: #6366f1;
        background: rgba(99, 102, 241, 0.08);
        cursor: pointer;
        flex-shrink: 0;
      }
      #userProfileSignOut:hover {
        background: rgba(99, 102, 241, 0.15);
      }
      #appRoot {
        display: none;
        flex: 1;
        flex-direction: column;
        min-height: 100vh;
        width: 100%;
      }
      #appRoot.app-visible {
        display: flex;
      }
      #historyList {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      #historyList li.history-item {
        list-style: none;
      }
    </style>
  </head>
  <body class="theme-beginner">
    <!-- Auth gate (shown until signed in) -->
    <div id="authOverlay" aria-live="polite">
      <div class="auth-glass-card text-center">
        <h2 class="google-sans text-2xl font-bold text-indigo-500 mb-2">Athena</h2>
        <p class="text-sm text-slate-600 dark:text-slate-400 mb-1">
          Sign in to save your learning history across devices.
        </p>
        <button type="button" id="signInGoogleBtn">
          <svg class="w-5 h-5" viewBox="0 0 24 24" aria-hidden="true">
            <path
              fill="#4285F4"
              d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
            />
            <path
              fill="#34A853"
              d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
            />
            <path
              fill="#FBBC05"
              d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
            />
            <path
              fill="#EA4335"
              d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
            />
          </svg>
          Sign in with Google
        </button>
      </div>
    </div>

    <div id="appRoot">
    <!-- Splash Screen -->
    <div id="splash-screen">
      <div
        class="splash-logo-container flex flex-col items-center justify-center px-6 text-center"
      >
        <h1
          class="splash-wordmark text-6xl sm:text-7xl font-bold google-sans text-indigo-500 tracking-tight"
        >
          Athena
        </h1>
      </div>
    </div>

    <!-- Sidebar Overlay -->
    <div
      id="sidebarOverlay"
      class="sidebar-overlay"
      onclick="toggleSidebar()"
    ></div>

    <!-- Sidebar -->
    <aside id="sidebar">
      <div class="flex items-center justify-between mb-8">
        <span
          class="text-2xl font-bold google-sans tracking-tighter text-indigo-500"
          >Athena</span
        >
        <button onclick="toggleSidebar()" class="lg:hidden p-2 text-slate-400">
          <svg
            class="w-6 h-6"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              d="M6 18L18 6M6 6l12 12"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
            ></path>
          </svg>
        </button>
      </div>

      <div
        class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-4 px-2"
      >
        Chat History
      </div>
      <div id="sidebarHistory" class="flex-grow overflow-y-auto">
        <ul id="historyList">
          <li class="text-xs text-gray-400 italic px-4 list-none">
            Sign in to see your history…
          </li>
        </ul>
      </div>

      <div
        class="border-t border-gray-100 dark:border-slate-700 pt-6 space-y-2"
      >
        <p
          id="sidebarProfileName"
          class="px-4 text-xs font-semibold text-gray-700 dark:text-slate-300 truncate mb-1"
        >
          —
        </p>
        <button
          type="button"
          id="sidebarSignOutBtn"
          class="w-full flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-gray-50 dark:hover:bg-slate-800 transition-colors text-sm font-medium text-red-600 dark:text-red-400"
        >
          <svg
            class="w-5 h-5"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"
            />
          </svg>
          Sign out
        </button>
        <button
          onclick="openProfile()"
          class="w-full flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-gray-50 dark:hover:bg-slate-800 transition-colors text-sm font-medium text-gray-700 dark:text-slate-300"
        >
          <svg
            class="w-5 h-5 text-indigo-400"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
            ></path>
          </svg>
          Profile
        </button>
        <button
          onclick="openSettings()"
          class="w-full flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-gray-50 dark:hover:bg-slate-800 transition-colors text-sm font-medium text-gray-700 dark:text-slate-300"
        >
          <svg
            class="w-5 h-5 text-indigo-400"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37.996.608 2.296.07 2.572-1.065zM15 12a3 3 0 11-6 0 3 3 0 016 0z"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
            ></path>
          </svg>
          Settings
        </button>
      </div>
    </aside>

    <!-- Modals -->
    <div id="profileModal" class="modal" onclick="closeModal('profileModal')">
      <div class="modal-content" onclick="event.stopPropagation()">
        <h3 class="text-2xl font-bold google-sans mb-4">Profile</h3>
        <div class="flex items-center gap-4 mb-6">
          <div
            id="profileAvatarLetter"
            class="w-16 h-16 rounded-full bg-indigo-100 dark:bg-slate-800 flex items-center justify-center text-indigo-600 font-bold text-2xl"
          >
            A
          </div>
          <div>
            <p id="profileModalDisplayName" class="font-bold text-lg">
              Athena Explorer
            </p>
            <p id="profileModalEmail" class="text-sm text-gray-500">
              Signed in with Google
            </p>
          </div>
        </div>
        <button
          onclick="closeModal('profileModal')"
          class="w-full bg-indigo-500 text-white py-3 rounded-2xl font-bold hover:bg-indigo-600 transition-colors"
        >
          Close
        </button>
      </div>
    </div>

    <div id="settingsModal" class="modal" onclick="closeModal('settingsModal')">
      <div class="modal-content" onclick="event.stopPropagation()">
        <h3 class="text-2xl font-bold google-sans mb-4">Settings</h3>
        <div class="space-y-4 mb-6">
          <div
            class="flex items-center justify-between p-4 bg-gray-50 dark:bg-slate-800 rounded-2xl border dark:border-slate-700"
          >
            <span class="font-medium">Reduced Animations</span>
            <input type="checkbox" class="w-5 h-5 rounded accent-indigo-500" />
          </div>
          <div
            class="flex items-center justify-between p-4 bg-gray-50 dark:bg-slate-800 rounded-2xl border dark:border-slate-700"
          >
            <span class="font-medium">Compact View</span>
            <input type="checkbox" class="w-5 h-5 rounded accent-indigo-500" />
          </div>
        </div>
        <button
          onclick="closeModal('settingsModal')"
          class="w-full bg-indigo-500 text-white py-3 rounded-2xl font-bold hover:bg-indigo-600 transition-colors"
        >
          Save Settings
        </button>
      </div>
    </div>

    <div id="main-content" class="flex-grow flex flex-col w-full">
      <header
        class="fixed top-0 inset-x-0 z-50 bg-white/50 backdrop-blur-xl border-b border-white/20 px-4 md:px-8 py-5 flex justify-between items-center transition-colors"
      >
        <div class="flex items-center gap-4">
          <button
            onclick="toggleSidebar()"
            class="p-2.5 hover:bg-white/50 dark:hover:bg-slate-700 rounded-xl transition-all"
          >
            <svg
              class="w-6 h-6 text-indigo-500"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                d="M4 6h16M4 12h16M4 18h16"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
              ></path>
            </svg>
          </button>
          <span
            class="text-3xl font-bold google-sans tracking-tighter text-indigo-500"
            >Athena</span
          >
        </div>
        <div class="flex items-center gap-3 md:gap-5">
          <div id="userProfile">
            <span id="userProfileName"></span>
            <button type="button" id="userProfileSignOut">Sign out</button>
          </div>
          <button
            onclick="toggleDarkMode()"
            class="p-2.5 hover:bg-white/50 dark:hover:bg-slate-700 rounded-full transition-all"
          >
            <svg
              class="w-6 h-6 text-slate-400"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
              ></path>
            </svg>
          </button>
          <button
            onclick="newChat()"
            class="text-xs md:text-sm font-bold text-white px-4 md:px-6 py-2.5 bg-indigo-500 rounded-full shadow-lg hover:bg-indigo-600 transition-all flex items-center gap-2"
          >
            <svg
              class="w-4 h-4"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                d="M12 4v16m8-8H4"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
              ></path>
            </svg>
            <span class="hidden sm:inline">New Chat</span>
          </button>
        </div>
      </header>

      <main
        id="main-wrapper"
        class="opacity-0 transition-opacity duration-1000 max-w-5xl mx-auto w-full pt-44 pb-32 px-6 flex flex-col min-h-screen"
      >
        <div class="text-center mb-16">
          <h2 class="hero-subtitle google-sans mx-auto max-w-3xl">
            Hello! What would you like to simplify today?
          </h2>
        </div>

        <!-- Main Input Control -->
        <div
          class="bg-white/80 backdrop-blur-md border border-white rounded-[40px] p-3 shadow-xl focus-within:shadow-2xl transition-all mb-12"
        >
          <div class="flex flex-col lg:flex-row items-center gap-4">
            <!-- Attachment Sign (Gemini Style) -->
            <div class="relative pl-4 lg:pl-6">
              <button
                id="attachmentBtn"
                onclick="toggleAttachmentMenu(event)"
                class="p-3 hover:bg-gray-100 dark:hover:bg-slate-800 rounded-full transition-colors text-indigo-500"
              >
                <svg
                  class="w-6 h-6"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M12 4v16m8-8H4"
                  ></path>
                </svg>
              </button>
              <!-- Dropdown Menu -->
              <div
                id="attachmentMenu"
                class="athena-popover hidden absolute bottom-full left-0 mb-4 rounded-2xl shadow-2xl p-2 w-48 z-50"
              >
                <button
                  type="button"
                  onclick="triggerImagePick(event)"
                  class="w-full flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-black/5 dark:hover:bg-white/10 transition-colors text-sm font-medium"
                >
                  <svg
                    class="w-5 h-5 text-indigo-500"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h14a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"
                    ></path>
                  </svg>
                  Upload image
                </button>
                <button
                  type="button"
                  onclick="triggerFilePick(event)"
                  class="w-full flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-black/5 dark:hover:bg-white/10 transition-colors text-sm font-medium"
                >
                  <svg
                    class="w-5 h-5 text-indigo-500"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.414a4 4 0 00-5.656-5.656l-6.415 6.414a6 6 0 108.486 8.486L20.5 13"
                    ></path>
                  </svg>
                  Upload file
                </button>
              </div>
            </div>
            <input
              type="file"
              id="hiddenImageInput"
              class="hidden"
              accept="image/jpeg,image/png,image/gif,image/webp,image/*"
              onchange="onHiddenImageChange(event)"
            />
            <input
              type="file"
              id="hiddenFileInput"
              class="hidden"
              accept=".pdf,.txt,.docx,application/pdf,text/plain,application/vnd.openxmlformats-officedocument.wordprocessingml.document"
              onchange="onHiddenFileChange(event)"
            />

            <div class="flex-grow w-full px-4 py-3">
              <input
                type="text"
                id="conceptInput"
                onkeydown="handleEnter(event)"
                placeholder="Enter a concept (e.g. Entropy, CRISPR)..."
                class="w-full bg-transparent border-none outline-none py-2 text-xl font-light text-inherit placeholder:text-gray-300 transition-colors"
              />
              <input
                type="text"
                id="majorInput"
                onkeydown="handleEnter(event)"
                placeholder="Your specific major or field (e.g. Design, Law)..."
                class="w-full bg-transparent border-none outline-none py-1 text-xs font-medium text-indigo-400"
              />
              <div
                id="attachmentPreview"
                class="hidden mt-3 pt-3 border-t border-gray-100 dark:border-slate-700"
              ></div>
            </div>

            <div class="w-full lg:w-auto px-4">
              <div class="segmented-control">
                <div id="slider" class="slider"></div>
                <button
                  class="segment-btn relative"
                  onclick="setMode('child', 0)"
                >
                  Child
                </button>
                <button
                  class="segment-btn relative active"
                  id="defaultMode"
                  onclick="setMode('beginner', 1)"
                >
                  Beginner
                </button>
                <button
                  class="segment-btn relative"
                  onclick="setMode('adult', 2)"
                >
                  Expert
                </button>
              </div>
            </div>

            <button
              id="simplifyBtn"
              onclick="generateResponse(this)"
              class="w-full lg:w-auto bg-indigo-500 text-white rounded-[32px] px-10 py-5 font-bold hover:bg-indigo-600 transition-all active:scale-95 flex items-center justify-center gap-3 shadow-lg"
            >
              <span>Explain</span>
              <svg
                class="w-5 h-5"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  d="M13 5l7 7-7 7M5 5l7 7-7 7"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                ></path>
              </svg>
            </button>
          </div>
        </div>

        <!-- Conversation Display -->
        <div id="chatHistory" class="space-y-12"></div>

        <!-- Loading State -->
        <div
          id="loadingState"
          class="hidden-el space-y-6 animate-pulse mt-12 px-12"
        >
          <div
            class="h-6 bg-slate-200 dark:bg-slate-700 rounded-full w-2/3"
          ></div>
          <div
            class="h-48 bg-white/50 dark:bg-slate-800 rounded-[40px] w-full"
          ></div>
        </div>
      </main>
    </div>
    </div>
    <!-- /#appRoot -->

    <!-- Template for History Item -->
    <template id="historyTemplate">
      <div class="chat-item space-y-6">
        <div class="flex justify-end pr-4">
          <div
            class="bg-indigo-500 text-white px-8 py-4 rounded-[28px] chat-bubble shadow-lg max-w-[min(100%,28rem)]"
          >
            <div
              class="prompt-image-wrap mb-2 hidden rounded-xl overflow-hidden border border-white/20"
            ></div>
            <p class="font-bold text-lg prompt-text break-words"></p>
          </div>
        </div>

        <div class="answer-panel p-10 rounded-[48px] shadow-sm space-y-8">
          <div class="flex flex-wrap gap-3 prerequisite-container"></div>
          <div
            class="output-content space-y-6 text-xl leading-relaxed font-light text-[color:var(--athena-text)]"
          ></div>
          <div
            class="video-container rounded-[32px] overflow-hidden bg-gray-900 aspect-video hidden-el ring-8 ring-gray-50 dark:ring-slate-900"
          ></div>
          <div class="border-t border-gray-50 dark:border-slate-700 pt-6">
            <button
              onclick="copyToClipboard(this)"
              class="text-xs font-bold text-gray-400 uppercase tracking-widest hover:text-indigo-500 transition-colors"
            >
              Copy Link
            </button>
          </div>
        </div>
      </div>
    </template>

    <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@2.16.105/build/pdf.min.js"></script>
    <script>
      if (typeof pdfjsLib !== "undefined") {
        pdfjsLib.GlobalWorkerOptions.workerSrc =
          "https://cdn.jsdelivr.net/npm/pdfjs-dist@2.16.105/build/pdf.worker.min.js";
      }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js"></script>
    <script type="module" src="script.js"></script>
  </body>
</html>
